services:
  - type: web
    name: agronex-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        sync: false
      # Comma-separated list of allowed CORS origins.
      # Set this after deploying agronex-frontend to your Vercel URL:
      # - key: ALLOWED_ORIGINS
      #   value: https://your-app.vercel.app
      # Secrets — set these manually in the Render dashboard (do NOT commit):
      # - key: GITHUB_TOKEN
      #   sync: false
      # - key: TOMORROW_KEY
      #   sync: false
